"""GraphQL SDL schema fixture for UAA testing."""

type Query {
  me: User
  user(id: ID!): User
  users(limit: Int): [User!]!
}

type Mutation {
  createUser(input: CreateUserInput!): User!
  deleteUser(id: ID!): Boolean!
}

type User {
  id: ID!
  username: String!
  email: String!
  role: String!
}

input CreateUserInput {
  username: String!
  email: String!
}

